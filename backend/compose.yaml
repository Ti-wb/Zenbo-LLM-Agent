name: zenbo-gateway

x-gateway-image: &gateway-image
  image: zenbo-gateway:${GATEWAY_IMAGE_TAG:-local}
  build:
    context: .
    args:
      VERSION: ${GATEWAY_VERSION:-dev}

x-gateway-environment: &gateway-environment
  GATEWAY_DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/gateway?sslmode=disable
  GATEWAY_DEVICE_HMAC_KEY: ${GATEWAY_DEVICE_HMAC_KEY:?Set a random 32-byte or encoded key}
  GATEWAY_PROFILES_FILE: /etc/zenbo-gateway/profiles.json
  GATEWAY_ARTIFACT_DIR: /var/lib/zenbo-gateway/artifacts
  GATEWAY_CODEX_HOME: /var/lib/zenbo-gateway/codex
  GATEWAY_CODEX_CWD: /var/empty/codex
  GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
  LITELLM_API_KEY: ${LITELLM_API_KEY:?Set LITELLM_API_KEY}

x-gateway-volumes: &gateway-volumes
  - artifacts:/var/lib/zenbo-gateway/artifacts
  - codex-home:/var/lib/zenbo-gateway/codex
  - ./profiles.json:/etc/zenbo-gateway/profiles.json:ro

services:
  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    <<: *gateway-image
    command: ["migrate"]
    restart: "no"
    environment: *gateway-environment
    volumes: *gateway-volumes
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    <<: *gateway-image
    command: ["serve"]
    restart: unless-stopped
    environment: *gateway-environment
    volumes: *gateway-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9090/readyz"]
      interval: 15s
      timeout: 10s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose: ["8080"]
    networks: [internal]

  worker:
    <<: *gateway-image
    command: ["worker"]
    restart: unless-stopped
    environment: *gateway-environment
    volumes: *gateway-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9090/readyz"]
      interval: 15s
      timeout: 10s
      retries: 5
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [internal]

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      GATEWAY_HOST: ${GATEWAY_HOST:?Set the public DNS name}
      ACME_EMAIL: ${ACME_EMAIL:?Set the ACME contact email}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  artifacts:
  codex-home:
  caddy-data:
  caddy-config:

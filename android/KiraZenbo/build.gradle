apply plugin: 'com.android.application'

android {
    namespace "com.robot.asus.kira"
    // UPDATED: Modern libraries require a recent Android SDK.
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.robot.asus.kira"
        minSdkVersion 23
        // UPDATED: targetSdkVersion should match compileSdkVersion.
        targetSdkVersion 36
        versionCode 1
        versionName "0.1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    packagingOptions {
        doNotStrip "*/armeabi-v7a/*"
        doNotStrip "*/arm64-v8a/*"
        doNotStrip "*/x86/*"
        doNotStrip "*/x86_64/*"
    }

    // Keep a universal debug APK for unknown/legacy Zenbo deployments while
    // also producing installable ABI-specific APKs for measured device rollout.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    compileOptions {
        // Use a more modern Java language level; Android desugaring will adapt bytecode as needed.
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// 2. Add Mozilla’s Maven repository
// This tells Gradle where to download the GeckoView library from.
// google() and mavenCentral() are standard repositories for Android development.
repositories {
    google()
    mavenCentral()
    maven {
        url "https://maven.mozilla.org/maven2/"
    }
}

def generatedLicenseAssetsDir = layout.buildDirectory.dir('generated/licenseAssets')
def bundledLicenseFiles = [
        rootProject.file('../LICENSE'),
        rootProject.file('../THIRD_PARTY_NOTICES.md'),
        rootProject.file('../WEB_THIRD_PARTY_LICENSES.txt'),
        rootProject.file('NOTICE')
]

tasks.register('bundleLicenseAssets', Copy) {
    from(bundledLicenseFiles) {
        into 'licenses'
    }
    into generatedLicenseAssetsDir

    doFirst {
        bundledLicenseFiles.each { licenseFile ->
            if (!licenseFile.isFile()) {
                throw new GradleException("Missing required license asset: ${licenseFile}")
            }
        }
    }
}

android.sourceSets.main.assets.srcDir(generatedLicenseAssetsDir)

tasks.named('preBuild').configure {
    dependsOn tasks.named('bundleLicenseAssets')
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    // UPDATED: Migrated from the old support library to the modern AndroidX equivalent.
    implementation 'androidx.appcompat:appcompat:1.7.1'

    implementation project(':RobotActivityLibrary')

    // 3. ADDED: The GeckoView implementation dependency
    implementation 'org.mozilla.geckoview:geckoview:143.0.20250929153833'

    // AndroidAsync HTTP/WebSocket server for robot event streaming.
    implementation 'com.koushikdutta.async:androidasync:3.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

}
